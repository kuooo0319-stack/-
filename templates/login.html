<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>登入 · 腳本拆解機</title>
<style>
  :root{ --gold:#d9a441; --gold-dark:#b9852c; --card:#f6f1e6; --text-dark:#2b2620; --muted:#8a8272; }
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:#15141a; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif;
  }
  .box{
    background:var(--card); color:var(--text-dark); border-radius:16px; padding:32px;
    width:min(360px, 90vw); box-shadow:0 20px 60px rgba(0,0,0,.4);
  }
  h1{ font-size:20px; margin:0 0 4px; }
  .sub{ color:var(--muted); font-size:13px; margin-bottom:22px; }
  label{ display:block; font-size:13px; font-weight:600; margin-bottom:6px; }
  input{
    width:100%; padding:12px 14px; border-radius:10px; border:1px solid #ddd0ac;
    font-size:14px; margin-bottom:16px;
  }
  button{
    width:100%; padding:12px; border-radius:10px; border:none; background:var(--gold);
    color:#2b2100; font-weight:700; font-size:14px; cursor:pointer;
  }
  button:hover{ background:var(--gold-dark); }
  .err{ background:#fbe4e8; color:#8a1f36; border:1px solid #f0b7c2; border-radius:10px; padding:10px 14px; font-size:13px; margin-bottom:16px; }
</style>
</head>
<body>
  <form class="box" method="post" action="/login">
    <h1>腳本拆解機</h1>
    <div class="sub">請輸入密碼繼續</div>
    <!--ERROR-->
    <label>密碼</label>
    <input type="password" name="password" autofocus required />
    <button type="submit">登入</button>
  </form>
</body>
</html>
